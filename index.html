<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Algihaz Legal Case Management</title>
    <meta name="description" content="Internal legal case management for Algihaz Holding." />
    <meta name="author" content="Algihaz Holding" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script>
      // apply the saved theme before first paint so dark mode never flashes white
      (function () {
        try {
          var t = localStorage.getItem("lcms-theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      /* Splash: shown from the very first byte, before any JavaScript has loaded, and faded out by
         src/lib/splash.ts once the app is ready. Plain CSS on purpose: nothing here may wait for the bundle. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 20% 10%, oklch(0.55 0.16 250 / 0.35), transparent 70%),
          radial-gradient(50% 45% at 85% 95%, oklch(0.6 0.12 195 / 0.22), transparent 70%),
          oklch(0.19 0.06 252);
        color: oklch(0.98 0.008 250);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      /* leaving: it thins out and drifts slightly toward you, as if the app is coming forward */
      #splash.splash-hide { opacity: 0; transform: scale(1.03); pointer-events: none; }
      #splash .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #splash .splash-logo { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
      #splash .splash-glow {
        position: absolute; inset: -30px; border-radius: 50%;
        background: radial-gradient(closest-side, oklch(0.62 0.17 250 / 0.45), transparent);
        animation: splash-glow 2.4s ease-in-out infinite;
      }
      #splash .splash-ring {
        position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 55%, oklch(0.78 0.13 235) 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: splash-spin 1.1s linear infinite;
      }
      #splash .splash-track {
        position: absolute; inset: 0; border-radius: 50%;
        border: 2px solid oklch(1 0 0 / 0.08);
      }
      #splash .splash-mark {
        width: 68px; height: 68px; border-radius: 20px; display: grid; place-items: center;
        background: linear-gradient(145deg, oklch(0.62 0.17 248), oklch(0.46 0.16 255));
        box-shadow: 0 10px 30px oklch(0.2 0.1 255 / 0.6), inset 0 1px 0 oklch(1 0 0 / 0.25);
        animation: splash-breathe 2.2s ease-in-out infinite;
      }
      #splash .splash-gavel { width: 34px; height: 34px; transform-origin: 20% 80%; animation: splash-strike 1.6s ease-in-out infinite; }
      #splash .splash-name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; animation: splash-rise 0.6s 0.15s ease-out both; }
      #splash .splash-sub {
        margin-top: -14px; font-size: 13px; color: oklch(0.78 0.04 248);
        animation: splash-rise 0.6s 0.3s ease-out both;
      }
      #splash .splash-dots span {
        display: inline-block; width: 4px; height: 4px; margin-left: 3px; border-radius: 50%;
        background: currentColor; animation: splash-dot 1.2s ease-in-out infinite;
      }
      #splash .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      #splash .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      #splash .splash-bar { width: 132px; height: 3px; border-radius: 3px; overflow: hidden; background: oklch(1 0 0 / 0.1); }
      #splash .splash-bar::after {
        content: ""; display: block; width: 45%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, transparent, oklch(0.78 0.13 235), transparent);
        animation: splash-slide 1.3s ease-in-out infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes splash-glow { 0%, 100% { opacity: 0.55; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.05); } }
      @keyframes splash-strike { 0%, 55%, 100% { transform: rotate(-14deg); } 70% { transform: rotate(10deg); } 82% { transform: rotate(-4deg); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes splash-dot { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
      @keyframes splash-slide { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash * { animation: none !important; }
        #splash .splash-ring { background: oklch(0.78 0.13 235 / 0.5); }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Algihaz Legal">
      <div class="splash-inner">
        <div class="splash-logo">
          <div class="splash-glow"></div>
          <div class="splash-track"></div>
          <div class="splash-ring"></div>
          <div class="splash-mark">
            <svg class="splash-gavel" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" />
              <path d="m16 16 6-6" />
              <path d="m21.5 10.5-8-8" />
              <path d="m8 8 6-6" />
              <path d="m8.5 7.5 8 8" />
            </svg>
          </div>
        </div>
        <div class="splash-name">Algihaz Legal</div>
        <div class="splash-sub">Preparing your workspace<span class="splash-dots"><span></span><span></span><span></span></span></div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
