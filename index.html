<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Algihaz Legal Case Management</title>
    <meta name="description" content="Internal legal case management for Algihaz Holding." />
    <meta name="author" content="Algihaz Holding" />
    <script>
      // apply the saved theme before first paint so dark mode never flashes white
      (function () {
        try {
          var t = localStorage.getItem("lcms-theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <script>
      // A CloudFront/S3 deploy under a fixed subpath (see vite.config.ts's
      // VITE_BASE_PATH) has no default-document behaviour for a "directory" --
      // only the literal .../index.html object returns 200, the bare path 403s.
      // So that is the URL every first load actually arrives on, but the
      // router's basepath (import.meta.env.BASE_URL) has no "/index.html" in
      // it, so it fails to match any route. Strips it here, before the router
      // ever reads the URL, so it sees the clean directory-style path its
      // basepath expects. No-op for a root-path deploy or any later
      // client-side navigation (history.pushState never adds "index.html").
      (function () {
        try {
          if (location.pathname.endsWith("/index.html")) {
            history.replaceState(
              null,
              "",
              location.pathname.slice(0, -"index.html".length) + location.search + location.hash,
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
